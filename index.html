<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="setup-card" id="setupCard">
      <div class="section-heading">
        <div>
          <h1>Tournament generator</h1>
        </div>
        <span class="count-pill" id="competitorCount">0 players</span>
      </div>
      <label class="sr-only" for="competitors">Player names</label>
      <textarea id="competitors" rows="8" placeholder="One player per line or comma-separated"></textarea>
      <div class="controls">
        <label>Mode
          <select id="mode">
            <option value="list">Teams</option>
            <option value="random">Random matches</option>
            <option value="king">King of the hill</option>
            <option value="bracket">Bracket</option>
          </select>
        </label>
      </div>
      <button class="primary-button full-width" id="generateButton" type="button">Generate</button>
    </section>

    <section class="results" id="results" hidden>
      <div class="results-heading">
        <button class="text-button" id="newButton" type="button">New setup</button>
        <button class="icon-button" id="regenerateButton" type="button" aria-label="Regenerate lineup" title="Regenerate lineup">↻</button>
      </div>
      <div id="output" aria-live="polite"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/matchups.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
