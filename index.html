<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="setup-card" id="setupCard">
      <div class="section-heading">
        <div>
          <h1>Tournament generator</h1>
        </div>
        <span class="count-pill" id="competitorCount">0 players</span>
      </div>
      <label class="sr-only" for="competitors">Player names</label>
      <div class="competitor-input">
        <textarea id="competitors" rows="8" placeholder="One player per line or comma-separated"></textarea>
        <button class="clear-icon" id="clearCompetitorsButton" type="button" aria-label="Clear competitors" title="Clear competitors">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 15 8-8a2 2 0 0 1 3 0l4 4a2 2 0 0 1 0 3l-5 5H7l-3-3a2 2 0 0 1 0-1Z"></path>
            <path d="m10 9 5 5"></path>
            <path d="M14 19h7"></path>
          </svg>
        </button>
      </div>
      <div class="controls">
        <label>Mode
          <select id="mode">
            <option value="list">Teams</option>
            <option value="random">Random matches</option>
            <option value="king">King of the hill</option>
            <option value="bracket">Bracket</option>
          </select>
        </label>
      </div>
      <button class="primary-button full-width" id="generateButton" type="button">Generate</button>
      <button class="text-button full-width" id="editBlacklistButton" type="button">Edit blacklist</button>
      <section class="blacklist-editor" id="blacklistEditor" hidden>
        <div class="editor-heading">
          <h2>Blacklisted teams</h2>
          <button class="text-button" id="closeBlacklistButton" type="button">Close</button>
        </div>
        <div id="blacklistList"></div>
      </section>
    </section>

    <section class="results" id="results" hidden>
      <div class="results-heading">
        <button class="text-button" id="newButton" type="button">New setup</button>
        <button class="icon-button" id="regenerateButton" type="button" aria-label="Regenerate lineup" title="Regenerate lineup">↻</button>
      </div>
      <div id="output" aria-live="polite"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/matchups.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
